[project]
name = "credit-risk-stability"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=2.2",
    "pyarrow>=26.0.1",
    "pyyaml>=6",
    "scikit-learn>=1.9.1",
    "tabulate>=0.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
