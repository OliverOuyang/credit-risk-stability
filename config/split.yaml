# Time split by origination quarter (taken from Loan Identifier PYYQnXXXXXXX).
# Gap rule: latest origination of a segment + gap_months <= earliest origination of the next segment.
# Test rule: latest test origination + gap_months <= performance_cutoff (config/target.yaml).
gap_months: 24
segments:
  train: {start: "2005Q1", end: "2010Q4"}
  valid: {start: "2013Q1", end: "2013Q4"}
  test:  {start: "2016Q1", end: "2024Q2"}   # 2024Q2 + 24m = 2026Q2 = Release 48 performance cutoff
evaluation_unit: origination_year           # test is scored year by year
min_bads_per_eval_segment: 300
if_below_min_bads:                           # applied in order until every segment has >= 300 bads
  - use_full_volume_files_for_year           # full quarterly files instead of 50k sample
  - merge_adjacent_years
draft: true   # finalised in 2a after per-year bad counts; see docs/bad_counts.md
