# src/crs/model.py. Seed comes from config/repro.yaml. Main sample: excluded and assisted loans dropped.
woe:
  max_bins: 10          # numeric: train quantile bins, plus one bin for missing
  min_bin_share: 0.01   # categorical levels below this share of train go to "_other"
  smoothing: 0.5        # added to bad and good counts per bin
  iv_min: 0.02          # features below this information value are dropped from the scorecard
logistic:
  C: 1.0
lightgbm:
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 200
  feature_fraction: 0.8
  lambda_l2: 1.0
  cat_smooth: 50
  min_data_per_group: 200
  max_rounds: 2000
  early_stopping_rounds: 100   # on validation AUC
  num_threads: 4
evaluation:
  bootstrap_reps: 2000  # percentile intervals for AUC, KS, paired AUC difference
  ci_level: 0.95
  calibration_bins: 10  # predicted-probability deciles within each segment
dev:                    # synthetic subset for check_repro (runs in CI, no raw data)
  loans_per_segment: 3000
  bootstrap_reps: 20
# checks/check_training.py, on outputs/metrics.json "training". Project policy, not an industry standard:
# set 2026-11-28 from the first real run (AUC gap train - valid: scorecard 0.057, LightGBM 0.066; LightGBM
# stopped at round 37 of 2000). Train (2005-2010) and valid (2013-2014) are years apart, so the plain gap
# also holds drift; the excess of LightGBM's gap over the scorecard's isolates overfitting, since drift hits both.
training_checks:
  max_auc_gap: 0.10              # train - valid AUC, either model
  max_valid_above_train: 0.02    # valid clearly beating train hints at labels or future data leaking into valid
  max_gap_excess_lightgbm: 0.03  # LightGBM gap - scorecard gap
  min_best_iteration: 10         # stopping this early: valid AUC peaked at once, split or target mismatch
